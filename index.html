<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TS Todo</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 40px 20px;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
      }

      h1 {
        text-align: center;
        margin-top: 0;
      }

      #new-task-form {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
      }

      #new-task-title {
        flex: 1;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
      }

      button {
        border: none;
        border-radius: 6px;
        padding: 10px 15px;
        cursor: pointer;
      }

      #new-task-form button {
        background: #2563eb;
        color: white;
      }

      #list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .task-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        margin-bottom: 10px;
      }

      .task-title {
        flex: 1;
        cursor: pointer;
      }

      .completed {
        text-decoration: line-through;
        color: #888;
      }

      .delete-btn {
        background: #dc2626;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>TS Todo</h1>

      <form id="new-task-form">
        <input type="text" id="new-task-title" placeholder="Enter a task..." />

        <button type="submit">Add</button>
      </form>

      <ul id="list"></ul>
    </div>

    <script type="module" src="./src/script.ts"></script>
  </body>
</html>
